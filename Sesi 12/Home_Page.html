<!DOCTYPE HTML>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" }
  </script>
  <title>Home Page</title>
</head>

<body class="dark:bg-black bg-white">
  <nav class="flex justify-center max-w-screen">
    <ul class="flex space-x-6 text-gray-600 font-medium"> 
      <li><a href="Home_Page.html" class="hover:text-blue-300">Home</a></li>
      <li><a href="Map.html" class="hover:text-blue-300">Map</a></li>
      <li><a href="Contact.html" class="hover:text-blue-300">Contact Us</a></li>
      <li>
        
        <button onclick="changeTheme()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
         
          <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-500 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364-6.364l-1.414 1.414M6.05 17.95l-1.414 1.414M17.95 17.95l1.414 1.414M6.05 6.05L4.636 4.636M12 8a4 4 0 100 8 4 4 0 000-8z"/>
          </svg>
          
          <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-800 dark:text-gray-200 hidden" fill="currentColor" viewBox="0 0 24 24">
            <path fill-rule="evenodd" d="M17.293 14.707a8 8 0 11-7.586-7.586 8.001 8.001 0 007.586 7.586z" clip-rule="evenodd"/>
          </svg>
        </button>
      </li>
    </ul>
  </nav>

  <section>
    <div class="flex flex-col md:flex-row items-center max-w-screen m-2 h-[50vh] space-x-2">
      <div class="w-[50vw] dark:text-white flex justify-center items-center font-inter text-[50px] font-medium">
        Selamat Datang di Web Gis Sekadau
      </div>
      <div class="w-[50vw] flex justify-center items-center ">
        <img src="./Sekadau.png" class="h-[300px] md:h-[500px] md:mt-[200px]" />
      </div>
    </div>
  </section>

  <script>

    if (localStorage.theme === "dark") {
      document.documentElement.classList.add("dark")
    } else if (localStorage.theme === "light") {
      document.documentElement.classList.remove("dark")
    } else {
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark")
      }
    }

    function changeTheme() {
      if (document.documentElement.classList.contains("dark")) {
        document.documentElement.classList.remove("dark")
        localStorage.theme = "light"
      } else {
        document.documentElement.classList.add("dark")
        localStorage.theme = "dark"
      }
      updateIcons()
    }

    function updateIcons() {
      const isDark = document.documentElement.classList.contains("dark")
      document.getElementById("sunIcon").classList.toggle("hidden", !isDark)
      document.getElementById("moonIcon").classList.toggle("hidden", isDark)
    }

    updateIcons()
  </script>
</body>
</html>
